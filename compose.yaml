services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: cinema-api:latest
    environment:
      ConnectionStrings__cinema: "Host=postgres;Port=5432;Database=cinema;Username=cinema;Password=cinema"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
